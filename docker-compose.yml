services:
  app:
    image: ${IMAGE}
    container_name: hello-user
    restart: unless-stopped
    ports:
      - "80:5000"
    environment:
      APP_VERSION: ${APP_VERSION}
      AWS_REGION: ${AWS_REGION}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /hello-user/app
        awslogs-stream: ${HOSTNAME:-app-server}
        mode: non-blocking
        max-buffer-size: 4m

  redis:
    image: redis:7-alpine
    container_name: hello-user-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /hello-user/redis
        awslogs-stream: ${HOSTNAME:-app-server}
        mode: non-blocking
        max-buffer-size: 4m
