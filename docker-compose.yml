services:
  app:
  logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /hello-user/app
        awslogs-stream: app-server
    image: ${IMAGE}
    container_name: hello-user
    restart: unless-stopped
    ports:
      - "80:5000"
    environment:
      APP_VERSION: ${APP_VERSION}
      AWS_REGION: ${AWS_REGION}
      DYNAMODB_TABLE: ${DYNAMODB_TABLE}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  redis:
  logging:
      driver: awslogs
      options:
        awslogs-region: us-east-1
        awslogs-group: /hello-user/app
        awslogs-stream: app-server
    image: redis:7-alpine
    container_name: hello-user-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    # No "ports:" on purpose: Redis is reachable only inside the Docker network
