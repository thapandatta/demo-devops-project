name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      run_scans:
        description: "Run security scans and tests before building"
        type: boolean
        default: true
      stop_runner_after:
        description: "Stop the runner instance when the run finishes"
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

# Only one run at a time, because there is a single runner
concurrency:
  group: deploy-workflow
  cancel-in-progress: false

env:
  IMAGE_NAME: hello-user
  AWS_DEFAULT_REGION: us-east-1

jobs:
  # =====================================================================
  # 1. Wake the runner (GitHub-hosted, free)
  # =====================================================================
  start-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assume the AWS role through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Start the runner instance
        run: |
          if [ -z "${{ vars.RUNNER_INSTANCE_ID }}" ]; then
            echo "Repository variable RUNNER_INSTANCE_ID is not set"; exit 1
          fi
          aws ec2 start-instances --instance-ids "${{ vars.RUNNER_INSTANCE_ID }}"
          aws ec2 wait instance-running --instance-ids "${{ vars.RUNNER_INSTANCE_ID }}"
          aws ec2 wait instance-status-ok --instance-ids "${{ vars.RUNNER_INSTANCE_ID }}"
          echo "Instance is up. Waiting for the runner service to connect to GitHub..."
          sleep 45

  # =====================================================================
  # 2. Everything below runs on YOUR runner (inside the VPC)
  # =====================================================================
  preflight:
    needs: start-runner
    runs-on: [self-hosted, linux, aws-deploy]
    timeout-minutes: 15   # fails fast if the runner never connected
    steps:
      - name: Check the runner has every tool the pipeline needs
        run: |
          missing=0
          for tool in git docker java python3.12 checkov trivy aws curl jq base64; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "OK       $tool"
            else
              echo "MISSING  $tool"; missing=1
            fi
          done
          if ! docker info >/dev/null 2>&1; then
            echo "MISSING  docker access for this user (check the docker group)"; missing=1
          fi
          exit $missing

      - name: Show identity, memory and disk
        run: |
          aws sts get-caller-identity
          free -h
          df -h /

  security-scans:
    if: ${{ inputs.run_scans }}
    needs: preflight
    runs-on: [self-hosted, linux, aws-deploy]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (committed secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkov (Terraform security, report only)
        run: checkov -d terraform --framework terraform --soft-fail --quiet

  test-and-scan:
    if: ${{ inputs.run_scans }}
    needs: preflight
    runs-on: [self-hosted, linux, aws-deploy]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies in a throwaway virtualenv
        run: |
          python3.12 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet -r app/requirements.txt -r app/requirements-dev.txt

      - name: Run unit tests with coverage
        working-directory: app
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          pytest -v --cov=. --cov-report=term-missing --cov-report=xml:../coverage.xml

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-scan-push:
    needs: [preflight, security-scans, test-and-scan]
    # Runs when the scan jobs were skipped, but NOT when one of them failed
    if: ${{ !cancelled() && !failure() }}
    runs-on: [self-hosted, linux, aws-deploy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build image (local only)
        run: docker build -t ${{ env.IMAGE_NAME }}:scan ./app

      - name: Trivy (image vulnerabilities)
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed \
            --exit-code 1 ${{ env.IMAGE_NAME }}:scan

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push image (only reached if Trivy passed)
        run: |
          U="${{ secrets.DOCKERHUB_USERNAME }}"
          docker tag ${{ env.IMAGE_NAME }}:scan "$U/${{ env.IMAGE_NAME }}:latest"
          docker tag ${{ env.IMAGE_NAME }}:scan "$U/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "$U/${{ env.IMAGE_NAME }}:latest"
          docker push "$U/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Remove the Docker login and free disk space
        if: always()
        run: |
          docker logout || true
          docker image prune -af || true

  deploy:
    needs: build-scan-push
    runs-on: [self-hosted, linux, aws-deploy]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Find the app server
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=hello-user-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "App server not found. Run terraform apply first."; exit 1
          fi
          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Wait for the app server's SSM agent
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.instance.outputs.instance_id }}" \
              --query "InstanceInformationList[0].PingStatus" --output text)
            echo "Attempt $i: SSM status = $STATUS"
            [ "$STATUS" = "Online" ] && exit 0
            sleep 15
          done
          echo "SSM agent never came online"; exit 1

      - name: Deploy with Docker Compose via SSM
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)

          cat > params.json <<JSON
          {
            "commands": [
              "mkdir -p /opt/app",
              "echo '$COMPOSE_B64' | base64 -d > /opt/app/docker-compose.yml",
              "cd /opt/app",
              "export IMAGE=$IMAGE APP_VERSION=${{ github.sha }} AWS_REGION=us-east-1 DYNAMODB_TABLE=hello-user-items",
              "docker rm -f hello-user || true",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker image prune -af"
            ]
          }
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" --instance-id "${{ steps.instance.outputs.instance_id }}"

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            RESPONSE=$(curl -s --max-time 5 http://${{ steps.instance.outputs.public_ip }}/health || true)
            echo "Attempt $i: $RESPONSE"
            if echo "$RESPONSE" | grep -q '"status":"ok"'; then
              echo "Deployment healthy at http://${{ steps.instance.outputs.public_ip }}"
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed"; exit 1

      - name: Clean up
        if: always()
        run: rm -f params.json

  # =====================================================================
  # 3. Put the runner back to sleep (GitHub-hosted, free)
  # =====================================================================
  stop-runner:
    # Runs after success, failure or cancellation, unless you untick the option
    if: ${{ always() && inputs.stop_runner_after }}
    needs: [start-runner, preflight, security-scans, test-and-scan, build-scan-push, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assume the AWS role through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Stop the runner instance
        run: aws ec2 stop-instances --instance-ids "${{ vars.RUNNER_INSTANCE_ID }}"
