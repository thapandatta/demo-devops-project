
name: Build and Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: hello-user

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-user:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/hello-user:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
            script: |
                const token = await core.getIDToken('sts.amazonaws.com');
                const payload = JSON.parse(
                    Buffer.from(token.split('.')[1], 'base64url').toString()
                );

                console.log("OIDC issuer:", payload.iss);
                console.log("OIDC audience:", payload.aud);
                console.log("OIDC subject:", payload.sub);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find instance and public IP
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=hello-user-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Instance not found. Run terraform apply first."
            exit 1
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM agent to be online
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.instance.outputs.instance_id }}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text)

            echo "Attempt $i: SSM status = $STATUS"

            if [ "$STATUS" = "Online" ]; then
              exit 0
            fi

            sleep 15
          done

          echo "SSM agent never came online"
          exit 1

      - name: Deploy container via SSM
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/hello-user:${{ github.sha }}"

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"docker pull $IMAGE\",
              \"docker stop hello-user || true\",
              \"docker rm hello-user || true\",
              \"docker run -d --name hello-user --restart unless-stopped -p 80:5000 $IMAGE\",
              \"docker image prune -af\"
            ]" \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"
