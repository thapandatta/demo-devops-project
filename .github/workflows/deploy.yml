name: Build and Deploy

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  IMAGE_NAME: hello-user

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            app/requirements-dev.txt

   #   - name: Install dependencies
    #    run: pip install -r app/requirements.txt -r app/requirements-dev.txt

   #   - name: Run unit tests with coverage
   #     working-directory: app
  #     run: |
   #       pytest -v --cov=. --cov-report=term-missing --cov-report=xml:../coverage.xml

   #   - name: Upload coverage report
   #     uses: actions/upload-artifact@v4
    #    with:
    #      name: coverage-report
   #       path: coverage.xml

   #   - name: SonarCloud scan
  #      uses: SonarSource/sonarqube-scan-action@v5
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

   #   - name: SonarCloud quality gate
   #     uses: SonarSource/sonarqube-quality-gate-action@v1
   #     timeout-minutes: 5
  #      env:
   #       SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    needs: test-and-scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Find instance and public IP
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=hello-user-server" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "Instance not found. Run terraform apply first."
            exit 1
          fi
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "public_ip=$PUBLIC_IP" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM agent to be online
        run: |
          for i in $(seq 1 20); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.instance.outputs.instance_id }}" \
              --query "InstanceInformationList[0].PingStatus" --output text)
            echo "Attempt $i: SSM status = $STATUS"
            if [ "$STATUS" = "Online" ]; then exit 0; fi
            sleep 15
          done
          echo "SSM agent never came online"
          exit 1

      - name: Deploy with Docker Compose via SSM
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          COMPOSE_B64=$(base64 -w0 docker-compose.yml)

          cat > params.json <<JSON
          {
            "commands": [
              "mkdir -p /opt/app",
              "echo '$COMPOSE_B64' | base64 -d > /opt/app/docker-compose.yml",
              "cd /opt/app",
              "export IMAGE=$IMAGE APP_VERSION=${{ github.sha }} AWS_REGION=${{ vars.AWS_REGION }} DYNAMODB_TABLE=hello-user-items",
              "docker rm -f hello-user || true",
              "docker compose pull",
              "docker compose up -d --remove-orphans",
              "docker image prune -af"
            ]
          }
          JSON

          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ steps.instance.outputs.instance_id }}"