<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Videos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #1f2933;
    }
    main { max-width: 680px; margin: 0 auto; padding: 24px 16px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    h1 { font-size: 1.4rem; margin: 0; }
    button {
      background: #2563eb; color: #fff; border: 0; border-radius: 6px;
      padding: 8px 14px; font-size: 0.9rem; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    ul { list-style: none; margin: 0; padding: 0; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    li {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 14px 16px; cursor: pointer; border-bottom: 1px solid #eef0f3;
    }
    li:last-child { border-bottom: 0; }
    li:hover { background: #f1f5ff; }
    li.selected { background: #e0e9ff; }
    .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .length { color: #6b7280; font-size: 0.9rem; white-space: nowrap; }
    .message { padding: 24px; text-align: center; color: #6b7280; background: #fff; border-radius: 8px; }
    .error { color: #b91c1c; }
    #detail { margin-top: 16px; background: #fff; border-radius: 8px; padding: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    #detail[hidden] { display: none; }
    #detail h2 { margin: 0 0 12px; font-size: 1.1rem; overflow-wrap: anywhere; }
    dl { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; margin: 0; }
    dt { color: #6b7280; }
    dd { margin: 0; overflow-wrap: anywhere; }
    dd.description { white-space: pre-wrap; }
    a { color: #2563eb; }
    .hint { margin-top: 12px; font-size: 0.8rem; color: #9ca3af; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Videos</h1>
      <button id="refresh" type="button">Refresh</button>
    </header>

    <div id="list-area" aria-live="polite"></div>

    <section id="detail" hidden aria-live="polite"></section>
  </main>

  <script>
    const listArea = document.getElementById("list-area");
    const detail = document.getElementById("detail");
    const refreshButton = document.getElementById("refresh");

    // Build text safely. Values come from users, so never insert them as HTML.
    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    // Only allow a link to become clickable if it points at YouTube over http(s).
    function safeYouTubeUrl(value) {
      try {
        const url = new URL(value);
        const hosts = ["youtube.com", "www.youtube.com", "m.youtube.com",
                       "music.youtube.com", "youtu.be", "www.youtu.be"];
        if ((url.protocol === "https:" || url.protocol === "http:") && hosts.includes(url.hostname)) {
          return url.href;
        }
      } catch (error) { /* not a valid URL */ }
      return null;
    }

    // 135 -> "2h 15m", 45 -> "45m", 120 -> "2h"
    function formatLength(minutes) {
      const total = Number(minutes);
      if (!Number.isFinite(total) || total < 0) return "unknown";
      const hours = Math.floor(total / 60);
      const rest = total % 60;
      if (hours === 0) return rest + "m";
      return rest === 0 ? hours + "h" : hours + "h " + rest + "m";
    }

    function showMessage(text, isError) {
      listArea.replaceChildren(el("div", text, isError ? "message error" : "message"));
    }

    async function loadVideos() {
      detail.hidden = true;
      showMessage("Loading...");
      try {
        const response = await fetch("/videos");
        if (!response.ok) throw new Error("Server returned " + response.status);
        const data = await response.json();

        if (!data.videos.length) {
          showMessage("No videos yet.");
          return;
        }

        const list = el("ul");
        data.videos
          .slice()
          .sort((a, b) => a.ytvideoname.localeCompare(b.ytvideoname))
          .forEach((video) => {
            const row = el("li");
            row.tabIndex = 0;
            row.append(el("span", video.ytvideoname, "title"),
                       el("span", formatLength(video.length), "length"));
            row.addEventListener("click", () => showDetail(video.id, row));
            row.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                showDetail(video.id, row);
              }
            });
            list.append(row);
          });
        listArea.replaceChildren(list);
      } catch (error) {
        showMessage("Could not load videos. " + error.message, true);
      }
    }

    async function showDetail(id, row) {
      document.querySelectorAll("li.selected").forEach((li) => li.classList.remove("selected"));
      row.classList.add("selected");
      detail.hidden = false;
      detail.replaceChildren(el("p", "Loading details..."));

      try {
        const response = await fetch("/videos/" + encodeURIComponent(id));
        if (response.status === 404) throw new Error("This video no longer exists.");
        if (!response.ok) throw new Error("Server returned " + response.status);
        const video = await response.json();
        const cache = response.headers.get("X-Cache");

        const fields = el("dl");

        // Link: clickable only if it passes the YouTube check, otherwise plain text
        const linkCell = el("dd");
        const safeUrl = safeYouTubeUrl(video.ytlink);
        if (safeUrl) {
          const anchor = el("a", video.ytlink);
          anchor.href = safeUrl;
          anchor.target = "_blank";
          anchor.rel = "noopener noreferrer";
          linkCell.append(anchor);
        } else {
          linkCell.textContent = video.ytlink;
        }

        const descriptionCell = el("dd", video.description || "No description", "description");

        fields.append(
          el("dt", "Name"), el("dd", video.ytvideoname),
          el("dt", "Link"), linkCell,
          el("dt", "Length"), el("dd", formatLength(video.length) + " (" + video.length + " min)"),
          el("dt", "Description"), descriptionCell,
          el("dt", "ID"), el("dd", video.id)
        );

        const parts = [el("h2", video.ytvideoname), fields];
        if (cache) parts.push(el("p", "Served from cache: " + cache, "hint"));
        detail.replaceChildren(...parts);
      } catch (error) {
        detail.replaceChildren(el("p", error.message, "error"));
      }
    }

    refreshButton.addEventListener("click", loadVideos);
    loadVideos();
  </script>
</body>
</html>
